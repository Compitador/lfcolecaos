<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LF Colecionáveis - Vitrine de Miniaturas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fef2f2',
                            500: '#ef4444',
                            600: '#dc2626',
                            900: '#7f1d1d',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .grid-tight {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 2px;
        }
        @media (min-width: 640px) {
            .grid-tight {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 3px;
            }
        }
        @media (min-width: 1024px) {
            .grid-tight {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 4px;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-red-500 selection:text-white">

    <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 to-amber-500 flex items-center justify-center shadow-lg shadow-red-500/30">
                    <i class="fa-solid fa-car-side text-white text-lg"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-red-400 bg-clip-text text-transparent">LF Colecionáveis</span>
                    <span class="block text-[10px] uppercase tracking-widest text-red-500 font-semibold">Miniaturas & Diecast</span>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-xs text-slate-400 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
                    <span class="font-bold text-red-400">100</span> Carrinhos
                </div>
            </div>
        </div>
    </header>

    <section class="relative bg-gradient-to-b from-slate-900 via-slate-950 to-slate-950 py-10 px-4 sm:px-6 lg:px-8 border-b border-slate-800/60 overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#ef4444_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-4xl mx-auto text-center relative z-10">
            
            <div class="mb-6 flex flex-col items-center justify-center">
                <div class="w-full max-w-md h-48 sm:h-56 rounded-2xl bg-slate-900/90 border border-slate-800 flex items-center justify-center p-4 shadow-2xl overflow-hidden relative group">
                    <img id="main-logo" src="imagens/carro-000.jpg" alt="LF Colecionáveis Logo" onerror="this.src='https://placehold.co/500x250/1e293b/ef4444?text=imagens/carro-000.jpg'" class="w-full h-full object-contain">
                </div>
            </div>

            <div class="max-w-md mx-auto relative">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="filterCars()" placeholder="Buscar por número (ex: 001, 045)..." class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-11 pr-4 py-3 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500 shadow-inner transition">
            </div>
        </div>
    </section>

    <main class="flex-grow max-w-7xl w-full mx-auto px-1 sm:px-4 py-6">
        <div class="flex items-center justify-between mb-4 px-2">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center space-x-2">
                <i class="fa-solid fa-grid-2 text-red-500"></i>
                <span>Vitrine de Miniaturas</span>
            </h2>
            <div class="text-xs text-slate-500">Total: <span id="visible-count">100</span> itens</div>
        </div>

        <div id="car-grid" class="grid-tight"></div>
        
        <div id="no-results" class="hidden text-center py-16">
            <i class="fa-solid fa-car-burst text-4xl text-slate-600 mb-3"></i>
            <p class="text-slate-400 font-medium">Nenhum carrinho encontrado com esse número.</p>
        </div>
    </main>

    <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden items-center justify-center p-4" onclick="closeModal(event)">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 relative shadow-2xl scale-95 transition-transform duration-300" id="modal-content" onclick="event.stopPropagation()">
            <button onclick="closeModalDirect()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 w-8 h-8 rounded-full flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="flex flex-col items-center">
                <div class="w-full h-64 bg-slate-950 rounded-xl overflow-hidden mb-4 border border-slate-800 flex items-center justify-center relative">
                    <img id="modal-img" src="" alt="Miniatura" class="w-full h-full object-contain">
                </div>
                <span id="modal-tag" class="text-xs font-bold uppercase tracking-wider bg-red-500/10 text-red-400 px-3 py-1 rounded-full border border-red-500/20 mb-2"></span>
                <h3 id="modal-title" class="text-xl font-bold text-white text-center mb-1"></h3>
                <p id="modal-filename" class="text-xs font-mono text-slate-500 bg-slate-950 px-3 py-1 rounded border border-slate-800/60 mt-2"></p>
            </div>
        </div>
    </div>

    <footer class="bg-slate-900 border-t border-slate-800 mt-auto py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 LF Colecionáveis. Todos os direitos reservados.</p>
    </footer>

    <script>
        let carsData = [];
        for (let i = 1; i <= 100; i++) {
            const paddedNum = String(i).padStart(3, '0');
            carsData.push({
                id: i,
                padded: paddedNum,
                filename: `carro-${paddedNum}.jpg`,
                img: `imagens/carro-${paddedNum}.jpg`
            });
        }

        function renderCars(data) {
            const grid = document.getElementById('car-grid');
            const noResults = document.getElementById('no-results');
            const visibleCount = document.getElementById('visible-count');
            
            grid.innerHTML = '';
            visibleCount.textContent = data.length;

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(car => {
                const card = document.createElement('div');
                card.className = "group relative bg-slate-900 rounded-sm overflow-hidden border border-slate-800/80 hover:border-red-500/50 transition-all duration-200 cursor-pointer shadow-sm flex flex-col";
                card.onclick = () => openModal(car);
                
                card.innerHTML = `
                    <div class="aspect-[4/3] w-full bg-slate-950 overflow-hidden relative flex items-center justify-center">
                        <img src="${car.img}" alt="Carrinho ${car.padded}" loading="lazy" onerror="this.src='https://placehold.co/400x300/1e293b/ef4444?text=${car.filename}'" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        <span class="absolute top-0.5 left-0.5 bg-black/70 backdrop-blur-md text-[9px] font-mono text-red-400 px-1.5 py-0.5 rounded border border-red-500/20">#${car.padded}</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCars() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const filtered = carsData.filter(car => 
                car.padded.includes(query) ||
                car.id.toString() === query
            );
            renderCars(filtered);
        }

        function openModal(car) {
            const modal = document.getElementById('detail-modal');
            const modalImg = document.getElementById('modal-img');
            const modalTitle = document.getElementById('modal-title');
            const modalTag = document.getElementById('modal-tag');
            const modalFilename = document.getElementById('modal-filename');

            modalImg.src = car.img;
            modalImg.onerror = function() {
                this.src = `https://placehold.co/600x450/1e293b/ef4444?text=${car.filename}`;
            };
            modalTitle.textContent = `Carrinho #${car.padded}`;
            modalTag.textContent = 'LF Colecionáveis';
            modalFilename.textContent = `imagens/${car.filename}`;

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                document.getElementById('modal-content').classList.remove('scale-95');
                document.getElementById('modal-content').classList.add('scale-100');
            }, 10);
        }

        function closeModal(event) {
            if (event.target.id === 'detail-modal') {
                closeModalDirect();
            }
        }

        function closeModalDirect() {
            const modal = document.getElementById('detail-modal');
            document.getElementById('modal-content').classList.remove('scale-100');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 150);
        }

        window.onload = function() {
            renderCars(carsData);
        }
    </script>
</body>
</html>
